<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escape the prison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#ff9443;
    --orange-deep:#d9621f;
    --teal:#93d8c6;
    --ink:#140a05;
    --bone:#f1e8d8;
    --muted:#8d847a;
    --b:1;
    --pad:clamp(22px,6vw,96px);
    --display:'Luckiest Guy','Impact',system-ui,sans-serif;
    --text:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden}
  body{color:var(--bone);font-family:var(--text);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  button:focus{outline:none}

  #stage{position:fixed;inset:0;overflow:hidden;background:#000}

  /* ---------- background photo ---------- */
  .bg{position:absolute;inset:-4%;opacity:0;transition:opacity 3.4s ease .5s;animation:drift 38s ease-in-out infinite alternate}
  .revealed .bg{opacity:1}
  .bg-img{position:absolute;inset:0;background:url(bg.jpg) center/cover no-repeat;transform:scale(1.16);transition:transform 10s cubic-bezier(.2,.6,.2,1);filter:brightness(var(--b))}
  .revealed .bg-img{transform:scale(1.03)}
  @keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-1.6%,1.1%,0)}}
  @media (orientation:portrait){.bg-img{background-position:80% center}}

  .fog{position:absolute;inset:-25%;pointer-events:none;opacity:0;transition:opacity 5s ease 1.5s;
    background:
      radial-gradient(38% 28% at 28% 62%,rgba(210,200,190,.10),transparent 70%),
      radial-gradient(30% 22% at 72% 38%,rgba(255,140,70,.08),transparent 70%),
      radial-gradient(45% 30% at 55% 85%,rgba(160,190,180,.07),transparent 70%);
    animation:fog 24s ease-in-out infinite alternate}
  .revealed .fog{opacity:1}
  @keyframes fog{from{transform:translate3d(-4%,0,0)}to{transform:translate3d(4%,-2%,0)}}

  .shade{position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(ellipse at 60% 50%,transparent 35%,rgba(0,0,0,.78) 100%),
      linear-gradient(90deg,rgba(0,0,0,.62) 0%,rgba(0,0,0,.25) 38%,transparent 60%)}
  .flicker{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;animation:flick 11s infinite}
  @keyframes flick{0%,88%{opacity:0}88.6%{opacity:.42}89.2%{opacity:0}90%{opacity:.6}91.4%{opacity:0}100%{opacity:0}}
  .grain{position:absolute;inset:-60%;pointer-events:none;opacity:.09;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation:grain .8s steps(5) infinite}
  @keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-6%,4%)}40%{transform:translate(5%,-3%)}60%{transform:translate(-3%,-6%)}80%{transform:translate(6%,5%)}100%{transform:translate(0,0)}}

  /* ---------- black intro screen ---------- */
  #blackout{position:absolute;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;cursor:pointer;transition:opacity 2.8s ease .6s}
  #blackout.gone{opacity:0;pointer-events:none}
  #start{font-weight:700;font-size:clamp(15px,2.2vw,21px);letter-spacing:.55em;text-indent:.55em;text-transform:uppercase;color:#bdb2a2;padding:22px 30px;animation:pulse 2.6s ease-in-out infinite;transition:opacity .5s}
  .hint{font-weight:500;font-size:clamp(12px,1.4vw,14px);letter-spacing:.3em;text-indent:.3em;text-transform:uppercase;color:#4d463f;transition:opacity .5s}
  #blackout.tapped #start,#blackout.tapped .hint{opacity:0;animation:none}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

  /* ---------- screens ---------- */
  #ui{position:absolute;inset:0;z-index:10}
  .screen{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
  .screen.active{opacity:1;visibility:visible;transition:opacity .45s ease}

  /* main menu */
  #menu{display:flex;flex-direction:column;align-items:flex-start;padding:clamp(30px,9vh,110px) var(--pad) 40px;overflow-y:auto;overscroll-behavior:contain}
  .title{font-family:var(--display);font-weight:400;line-height:.86;opacity:0;transform:translateY(-16px);transition:opacity 1.8s ease,transform 1.8s ease}
  .title-in .title{opacity:1;transform:none}
  .title .t1,.title .t2{display:block;white-space:nowrap;-webkit-text-stroke:.1em var(--ink);paint-order:stroke fill}
  .t1{font-size:clamp(58px,11.5vw,156px);color:var(--orange);text-shadow:0 .07em 0 var(--ink),0 0 .6em rgba(255,120,40,.35);animation:titleFlick 9s infinite}
  .t2{font-size:clamp(34px,6.7vw,92px);color:var(--teal);text-shadow:0 .08em 0 var(--ink),0 0 .6em rgba(110,200,180,.25);margin-top:.06em;margin-left:.06em}
  .wobble span{display:inline-block;transform:translateY(var(--y)) rotate(var(--r));animation:bob 4.2s ease-in-out var(--d) infinite}
  @keyframes bob{0%,100%{translate:0 0}50%{translate:0 -.035em}}
  @keyframes titleFlick{0%,93%{opacity:1}93.5%{opacity:.55}94%{opacity:1}94.6%{opacity:.7}95.2%{opacity:1}}

  nav{margin-top:clamp(26px,7vh,84px);display:flex;flex-direction:column;gap:clamp(4px,1.2vh,12px)}
  nav .item{opacity:0}
  .menu-in nav .item{animation:slideIn .8s cubic-bezier(.2,.8,.2,1) calc(var(--i)*.16s) both}
  @keyframes slideIn{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
  .menu-btn{position:relative;display:block;font-family:var(--display);font-size:clamp(32px,4.6vw,60px);letter-spacing:.04em;line-height:1;padding:.14em .2em .04em .15em;color:var(--bone);-webkit-text-stroke:.09em var(--ink);paint-order:stroke fill;text-shadow:0 .07em 0 var(--ink);transition:transform .28s cubic-bezier(.3,1.6,.5,1),color .18s}
  .menu-btn::before{content:"";position:absolute;left:-.5em;top:50%;border-left:.36em solid var(--orange);border-top:.22em solid transparent;border-bottom:.22em solid transparent;transform:translateY(-50%) scale(0);transition:transform .22s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(0 2px 0 var(--ink))}
  .menu-btn:hover,.menu-btn:focus-visible{color:var(--orange);transform:translateX(.4em) rotate(-1.5deg)}
  .menu-btn:hover::before,.menu-btn:focus-visible::before{transform:translateY(-50%) scale(1)}
  .menu-btn:active{transform:translateX(.4em) scale(.95)}

  /* shared headings + back */
  .screen-title{font-family:var(--display);font-weight:400;font-size:clamp(30px,4.6vw,56px);letter-spacing:.04em;color:var(--bone);-webkit-text-stroke:.09em var(--ink);paint-order:stroke fill;text-shadow:0 .07em 0 var(--ink);text-align:center}
  .screen-title em{font-style:normal;color:var(--orange)}
  .back{position:absolute;left:var(--pad);bottom:clamp(18px,5vh,48px);font-family:var(--display);font-size:clamp(22px,2.6vw,32px);letter-spacing:.05em;color:var(--bone);-webkit-text-stroke:.09em var(--ink);paint-order:stroke fill;text-shadow:0 .07em 0 var(--ink);padding:.2em .3em .1em;transition:color .18s,transform .25s cubic-bezier(.3,1.6,.5,1)}
  .back:hover,.back:focus-visible{color:var(--orange);transform:translateX(-.25em)}
  .back .arr{display:inline-block;font-size:.7em;vertical-align:.12em;margin-right:.3em}

  /* chapter select */
  #chapters{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(16px,4.5vh,44px);padding:24px 20px clamp(70px,12vh,120px);background:radial-gradient(ellipse at center,rgba(0,0,0,.35),rgba(0,0,0,.78))}
  .cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(10px,1.5vw,22px);width:min(94vw,1240px);max-height:calc(100% - clamp(150px,26vh,230px));overflow-y:auto;overscroll-behavior:contain;padding:10px 8px 16px;scrollbar-width:thin;scrollbar-color:#3a2a1f transparent}
  .card{position:relative;display:block;width:100%;aspect-ratio:16/10;border-radius:clamp(12px,1.4vw,18px);overflow:hidden;background:#0d0a08;border:3px solid #3a2a1f;box-shadow:0 18px 44px rgba(0,0,0,.65);text-align:left;transition:transform .28s cubic-bezier(.3,1.5,.5,1),border-color .2s,box-shadow .25s}
  .card .thumb{position:absolute;inset:0;background:url(bg.jpg) 72% 62%/cover no-repeat;transition:transform .7s ease}
  .card .label{position:absolute;left:0;right:0;bottom:0;padding:clamp(18px,3vh,30px) clamp(8px,1.2vw,16px) clamp(7px,1.2vh,12px);background:linear-gradient(transparent,rgba(0,0,0,.9));display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  .card .num{white-space:nowrap;font-family:var(--display);font-size:clamp(15px,1.8vw,26px);letter-spacing:.04em;line-height:1;color:var(--bone);-webkit-text-stroke:.08em var(--ink);paint-order:stroke fill;text-shadow:0 .07em 0 var(--ink)}
  .card .num b{font-weight:400;color:var(--orange)}
  .card:not(.locked):hover,.card:not(.locked):focus-visible{border-color:var(--orange);transform:translateY(-6px) rotate(-.8deg);box-shadow:0 0 0 5px rgba(255,148,67,.16),0 24px 54px rgba(0,0,0,.7),0 0 46px rgba(255,148,67,.28)}
  .card:not(.locked):hover .thumb,.card:not(.locked):focus-visible .thumb{transform:scale(1.07)}
  .card.pressed{animation:press .38s ease}
  @keyframes press{0%{transform:scale(1)}35%{transform:scale(.95)}70%{transform:scale(1.02)}100%{transform:scale(1)}}

  .card .thumb2{background-position:34% 38%;filter:hue-rotate(-75deg) saturate(1.7) brightness(.75) contrast(1.1)}
  .card .thumb3{background-position:62% 30%;filter:hue-rotate(150deg) saturate(1.6) brightness(.72) contrast(1.15)}
  .card.locked{cursor:not-allowed;border-color:#262626;box-shadow:0 18px 44px rgba(0,0,0,.6)}
  .card.locked .thumb{background-position:18% 55%;filter:grayscale(1) brightness(.28) blur(2px);transform:scale(1.08)}
  .card.locked .thumb::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 12px,transparent 12px 24px)}
  .card .lockwrap{display:none}
  .card.locked .lockwrap{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:clamp(5px,1vh,10px)}
  .card.locked .lock{width:clamp(20px,2.4vw,34px);color:#6f6f6f;filter:drop-shadow(0 3px 0 #000)}
  .card.locked .num{color:#7b7b7b}
  .soon{font-weight:700;font-size:clamp(9px,.95vw,12px);letter-spacing:.18em;text-transform:uppercase;color:#b9b9b9;border:1.5px solid #5b5b5b;border-radius:6px;padding:.38em .55em .32em .75em;background:rgba(0,0,0,.55);white-space:nowrap}
  .card.shake{animation:shake .42s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

  /* settings */
  #settings{display:flex;align-items:center;justify-content:center;padding:20px 20px clamp(70px,12vh,120px);background:radial-gradient(ellipse at center,rgba(0,0,0,.35),rgba(0,0,0,.78))}
  .panel{width:min(94vw,540px);background:rgba(14,10,8,.86);border:2px solid #3a2a1f;border-radius:20px;padding:clamp(18px,3.4vh,30px) clamp(18px,3vw,32px) clamp(14px,2.6vh,24px);box-shadow:0 24px 60px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.04);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);position:relative}
  .panel::before{content:"";position:absolute;left:24px;right:24px;top:-2px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--orange),transparent)}
  .panel .screen-title{margin-bottom:clamp(8px,2vh,18px)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:clamp(10px,1.9vh,15px) 2px;border-top:1px solid rgba(255,255,255,.07)}
  .row > span,.row > label{white-space:nowrap;font-weight:600;font-size:clamp(17px,1.9vw,21px);letter-spacing:.12em;text-transform:uppercase;color:#d8cfc0}
  .ctl{display:flex;align-items:center;gap:12px;flex:0 1 230px}
  .ctl output{min-width:3ch;text-align:right;font-weight:700;font-size:18px;color:var(--orange);font-variant-numeric:tabular-nums}
  .note{font-weight:500;font-size:15px;color:var(--muted);text-align:right;max-width:200px}
  input[type=range]{--p:50%;-webkit-appearance:none;appearance:none;flex:1;height:8px;border-radius:8px;background:linear-gradient(90deg,var(--orange) var(--p),#2c221c var(--p));outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--bone);border:3px solid var(--ink);box-shadow:0 0 0 3px rgba(255,148,67,.35)}
  input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--bone);border:3px solid var(--ink);box-shadow:0 0 0 3px rgba(255,148,67,.35)}
  input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 5px rgba(255,148,67,.6)}
  .toggle{min-width:84px;padding:8px 14px 6px;border-radius:999px;font-family:var(--display);font-size:18px;letter-spacing:.08em;border:2px solid #4a3a2e;background:#1f1813;color:var(--muted);transition:background .2s,color .2s,border-color .2s}
  .toggle[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:var(--ink)}
  .toggle:focus-visible{box-shadow:0 0 0 3px rgba(255,148,67,.5)}
  .reset{display:block;margin:clamp(10px,2vh,16px) auto 0;font-weight:600;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:8px 12px;transition:color .2s}
  .reset:hover,.reset:focus-visible{color:var(--bone)}

  /* phones */
  @media (orientation:portrait){
    .cards{grid-template-columns:repeat(2,minmax(0,1fr));width:min(94vw,560px)}
    .card .num{font-size:clamp(15px,4.4vw,22px)}
    .soon{font-size:clamp(9px,2.4vw,11px)}
    .card.locked .lock{width:clamp(20px,6vw,30px)}
    .t1{font-size:min(17vw,120px)}
    .t2{font-size:min(10.2vw,72px)}
    .menu-btn{font-size:clamp(34px,9.5vw,60px)}
    .shade{background:radial-gradient(ellipse at 50% 55%,transparent 30%,rgba(0,0,0,.8) 100%),linear-gradient(180deg,rgba(0,0,0,.6) 0%,rgba(0,0,0,.15) 45%,transparent 65%)}
  }
  @media (max-height:460px){
    #menu{padding-top:22px}
    nav{margin-top:16px}
    .t1{font-size:clamp(48px,9vw,80px)}
    .t2{font-size:clamp(28px,5.4vw,48px)}
    .menu-btn{font-size:32px}
    .cards{max-height:calc(100% - 120px);gap:10px}
    .row{padding:7px 2px}
    .panel{padding-top:12px}
    .panel .screen-title{font-size:28px;margin-bottom:4px}
  }

  /* ---------- chapter 1 scene ---------- */
  #scene{position:fixed;inset:0;z-index:70;background:#000;display:none}
  #scene.on{display:block}
  #scene canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #scene canvas:active{cursor:grabbing}
  .hud-back{position:absolute;left:clamp(14px,3vw,30px);top:clamp(12px,2.6vh,26px);font-family:var(--display);font-size:clamp(18px,2vw,24px);letter-spacing:.06em;color:var(--bone);-webkit-text-stroke:.09em var(--ink);paint-order:stroke fill;text-shadow:0 .07em 0 var(--ink);padding:.3em .4em .2em;opacity:.45;transition:opacity .3s,color .2s,transform .25s cubic-bezier(.3,1.6,.5,1)}
  .hud-back:hover,.hud-back:focus-visible{opacity:1;color:var(--orange)}
  .hud-back .arr{display:inline-block;font-size:.7em;vertical-align:.12em;margin-right:.3em}
  .hud-back.done{opacity:1;animation:pulse 2s ease-in-out infinite}
  .hud-hint{position:absolute;left:50%;bottom:clamp(56px,12vh,96px);transform:translateX(-50%);font-weight:600;font-size:14px;letter-spacing:.3em;text-indent:.3em;text-transform:uppercase;color:#a49a8c;opacity:0;transition:opacity 1.2s;pointer-events:none;white-space:nowrap}
  .hud-hint.show{opacity:.75}
  .hud-credit{position:absolute;right:10px;bottom:8px;font-size:11px;letter-spacing:.03em;color:#6c655d;max-width:70vw;text-align:right}
  .hud-credit a{color:inherit}
  .hud-msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;flex-direction:column;align-items:center;gap:14px;text-align:center;font-weight:600;font-size:18px;letter-spacing:.12em;text-transform:uppercase;color:var(--bone)}
  .hud-msg.show{display:flex}
  .hud-msg button{font-family:var(--display);font-size:24px;letter-spacing:.06em;color:var(--ink);background:var(--orange);border-radius:999px;padding:.45em 1em .3em}
  #fade{position:fixed;inset:0;z-index:90;background:#000;opacity:0;pointer-events:none;transition:opacity 1.2s ease;display:flex;align-items:flex-end;justify-content:center}
  #fade.on{opacity:1;pointer-events:auto}
  #fade.slow{transition-duration:2.4s}
  #fade span{margin-bottom:12vh;font-weight:600;font-size:13px;letter-spacing:.4em;text-indent:.4em;text-transform:uppercase;color:#4d463f;opacity:0;transition:opacity .4s}
  #fade.loading span{opacity:1;animation:pulse 1.6s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){
    .bg,.fog,.grain,.flicker,.t1,.wobble span{animation:none}
  }
</style>
</head>
<body>
<div id="stage" data-screen="menu">
  <div class="bg"><div class="bg-img"></div></div>
  <div class="fog"></div>
  <div class="shade"></div>
  <div class="flicker"></div>
  <div class="grain"></div>

  <main id="ui">
    <!-- MAIN MENU -->
    <section id="menu" class="screen active" aria-label="Main menu">
      <h1 class="title" aria-label="Escape the prison">
        <span class="t1 wobble">ESCAPE</span>
        <span class="t2 wobble">THE PRISON</span>
      </h1>
      <nav>
        <div class="item" style="--i:0"><button class="menu-btn" data-go="chapters">PLAY</button></div>
        <div class="item" style="--i:1"><button class="menu-btn" data-go="settings">SETTINGS</button></div>
      </nav>
    </section>

    <!-- CHAPTER SELECT -->
    <section id="chapters" class="screen" aria-label="Select chapter">
      <h2 class="screen-title">SELECT <em>CHAPTER</em></h2>
      <div class="cards">
        <button class="card" id="ch1" aria-label="Chapter 1">
          <span class="thumb"></span>
          <span class="label"><span class="num">CHAPTER <b>1</b></span></span>
        </button>
        <button class="card" id="ch2" aria-label="Chapter 2">
          <span class="thumb thumb2"></span>
          <span class="lockwrap"><svg class="lock" viewBox="0 0 48 56" fill="none" aria-hidden="true"><path d="M12 24V16a12 12 0 0 1 24 0v8" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><rect x="4" y="23" width="40" height="31" rx="7" fill="currentColor"/><circle cx="24" cy="36" r="4.5" fill="#141414"/><rect x="21.6" y="37" width="4.8" height="9" rx="2.4" fill="#141414"/></svg><span class="soon">Finish Chapter 1</span></span>
          <span class="label"><span class="num">CHAPTER <b>2</b></span></span>
        </button>
        <button class="card" id="ch3" aria-label="Chapter 3">
          <span class="thumb thumb3"></span>
          <span class="lockwrap"><svg class="lock" viewBox="0 0 48 56" fill="none" aria-hidden="true"><path d="M12 24V16a12 12 0 0 1 24 0v8" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><rect x="4" y="23" width="40" height="31" rx="7" fill="currentColor"/><circle cx="24" cy="36" r="4.5" fill="#141414"/><rect x="21.6" y="37" width="4.8" height="9" rx="2.4" fill="#141414"/></svg><span class="soon">Finish Chapter 2</span></span>
          <span class="label"><span class="num">CHAPTER <b>3</b></span></span>
        </button>
        <button class="card locked" data-ch="4" aria-disabled="true" aria-label="Chapter 4, coming soon">
          <span class="thumb" style="background-position:55% 20%"></span>
          <span class="lockwrap"><svg class="lock" viewBox="0 0 48 56" fill="none" aria-hidden="true"><path d="M12 24V16a12 12 0 0 1 24 0v8" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><rect x="4" y="23" width="40" height="31" rx="7" fill="currentColor"/><circle cx="24" cy="36" r="4.5" fill="#141414"/><rect x="21.6" y="37" width="4.8" height="9" rx="2.4" fill="#141414"/></svg><span class="soon">Coming soon</span></span>
          <span class="label"><span class="num">CHAPTER 4</span></span>
        </button>

      .then(() => loadScript('naughty-data.js', () => !!window.NAUGHTY_DATA)).catch(() => {})
      .then(() => loadScript('syringeon-data.js', () => !!window.SYRINGEON_DATA)).catch(() => {});
    await wait(900);
    if (leaving) return;
    fadeEl.classList.add('slow'); fadeEl.classList.remove('on');
    setTimeout(() => sceneHint.classList.add('show'), 2600);
    setTimeout(() => sceneHint.classList.remove('show'), 7600);
  }
  async function exitChapter(){
    if (!inChapter || leaving) return;
    leaving = true; sfx('back');
    fadeEl.classList.remove('slow'); fadeEl.classList.add('on');
    await wait(1250);
    if (scene) { scene.stop(); scene = null; window.__scene = null; }
    // the ride track is Wheels of Freedom with the driver's line on top: hand over to the menu music at the same spot
    const ride = $('#ride'), ridePos = ride.paused ? -1 : ride.currentTime;
    for (const el of [voice, $('#borrowed'), $('#buckle'), $('#mines'), ride, $('#croak'), $('#hand'), $('#senengeon')]) { try { el.pause(); el.currentTime = 0; } catch (e) {} }
    try { speechSynthesis.cancel(); } catch (e) {}
    if (ridePos >= 0 && S.music) { try { music.currentTime = ridePos; } catch (e) {} fade = 1; applyMusic(); playMusic(); }
    sceneEl.querySelectorAll('canvas').forEach(c => c.remove());
    sceneEl.classList.remove('on'); sceneHint.classList.remove('show'); sceneMessage('');
    stage.style.visibility = '';
    inChapter = false;
    show('menu');
    if (!music.paused) { fade = 1; applyMusic(); }          // Wheels of Freedom is already playing from the ride
    else if (S.music) { fade = 0; applyMusic(); playMusic(); fadeIn(2500); }
    fadeEl.classList.add('slow'); fadeEl.classList.remove('on');
    leaving = false;
  }
  sceneBack.addEventListener('click', exitChapter);

  const ch1 = $('#ch1');
  ch1.addEventListener('click', () => { sfx('select'); ch1.classList.remove('pressed'); void ch1.offsetWidth; ch1.classList.add('pressed'); enterChapter1(); });
  // start downloading Chapter 1 as soon as the chapter list opens
  document.querySelector('[data-go="chapters"]').addEventListener('click', () => { loadChapterAssets().catch(() => {}); });
  const ch2 = $('#ch2');
  const ch3 = $('#ch3');
  const PROG = { done1: !!store.get('done1', false), done2: !!store.get('done2', false), done3: !!store.get('done3', false) };
  function refreshLocks(){
    for (const [card, n] of [[ch2, 2], [ch3, 3]]) {
      const locked = !PROG['done' + (n - 1)];
      card.classList.toggle('locked', locked);
      card.setAttribute('aria-disabled', locked ? 'true' : 'false');
      card.setAttribute('aria-label', locked ? 'Chapter ' + n + ', locked until you finish Chapter ' + (n - 1) : 'Chapter ' + n);
    }
  }
  function chapterDone(n){ PROG['done' + n] = true; store.set('done' + n, true); refreshLocks(); }
  function lockedShake(card){ sfx('locked'); card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); }
  refreshLocks();
  ch2.addEventListener('click', () => {
    if (ch2.classList.contains('locked')) { lockedShake(ch2); return; }
    sfx('select'); ch2.classList.remove('pressed'); void ch2.offsetWidth; ch2.classList.add('pressed'); enterChapter(2);
  });
  ch3.addEventListener('click', () => {
    if (ch3.classList.contains('locked')) { lockedShake(ch3); return; }
    sfx('select'); ch3.classList.remove('pressed'); void ch3.offsetWidth; ch3.classList.add('pressed'); enterChapter(3);
  });
  document.querySelectorAll('.card[data-ch]').forEach(c => c.addEventListener('click', () => lockedShake(c)));

  /* ---------- settings ---------- */
  const vol = $('#vol'), volOut = $('#volOut'), bri = $('#bri'), briOut = $('#briOut');
  const musicT = $('#musicT'), sfxT = $('#sfxT');
  if (!volOK) {
    $('#volRow .ctl').outerHTML = '<span class="note">Use your phone’s volume buttons</span>';
  }
  function fillRange(r){ r.style.setProperty('--p', ((r.value - r.min) / (r.max - r.min) * 100) + '%'); }
  function setToggle(btn, on){ btn.setAttribute('aria-pressed', on ? 'true' : 'false'); btn.textContent = on ? 'ON' : 'OFF'; }
  function render(){
    if (volOK) { vol.value = S.vol; volOut.textContent = S.vol; fillRange(vol); }
    bri.value = S.bri; briOut.textContent = S.bri; fillRange(bri);
    setToggle(musicT, S.music); setToggle(sfxT, S.sfx);
    stage.style.setProperty('--b', S.bri / 100);
    applyMusic();
  }
  function save(){ for (const k in S) store.set(k, S[k]); }

  if (volOK) vol.addEventListener('input', () => { S.vol = +vol.value; render(); save(); });
  bri.addEventListener('input', () => { S.bri = +bri.value; render(); save(); });
  musicT.addEventListener('click', () => {
    S.music = !S.music; render(); save(); sfx('tick');
    if (S.music && started) playMusic();
  });
  sfxT.addEventListener('click', () => { S.sfx = !S.sfx; render(); save(); sfx('tick'); });
  $('#reset').addEventListener('click', () => {
    Object.assign(S, DEF); render(); save(); sfx('tick');
    if (started) playMusic();
  });

  render();
})();
</script>
</body>
</html>
